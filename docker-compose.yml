services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pltt-video-studio-2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: palette_user
      POSTGRES_PASSWORD: palette_user_password
      POSTGRES_DB: pltt_video_studio_2
    ports:
      - "5455:5432"
    volumes:
      - pltt_video_studio_2_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palette_user -d pltt_video_studio_2"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pltt_video_studio_2_pg_data:
